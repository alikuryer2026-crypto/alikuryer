<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alikuryer — Supabase katalog tekshiruvi</title><style>body{font:16px system-ui;background:#f7f7f8;color:#222;margin:0}header{background:#e50914;color:white;padding:22px}main{max-width:1000px;margin:auto;padding:20px}h1{margin:0}button{background:#e50914;color:white;border:0;border-radius:12px;padding:12px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.card{background:white;padding:18px;border-radius:18px;box-shadow:0 4px 20px #0001}small{color:#666}.err{color:#b00020}select{padding:12px;border:1px solid #ddd;border-radius:10px;width:100%;margin:10px 0}</style></head><body><header><h1>Alikuryer</h1><div>Supabase katalog — texnik sinov sahifasi</div></header><main><p>Bu V11 bosh sahifasi emas. Bu sahifa haqiqiy restoran va taomlarni bazadan o‘qishni tekshiradi. Buyurtma yaratmaydi.</p><p id="status">Bazaga ulanmoqda...</p><h2>Restoranlar</h2><div id="restaurants" class="grid"></div><h2>Taomlar</h2><select id="restaurant"><option value="">Restoranni tanlang</option></select><div id="foods" class="grid"></div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
import {createAlikuryerCatalog} from './alikuryer-live-catalog-v2.js';
const supabase=createClient('https://tuncowhplrzqaohiisnc.supabase.co','sb_publishable_sGmCLa3T1L-_ha1Ga6oBdA_yYiCiMKJ');
const api=createAlikuryerCatalog(supabase),status=document.querySelector('#status'),list=document.querySelector('#restaurants'),select=document.querySelector('#restaurant'),foods=document.querySelector('#foods');
function card(title,sub){const div=document.createElement('div');div.className='card';const b=document.createElement('b');b.textContent=title;const p=document.createElement('p');p.textContent=sub??'';div.append(b,p);return div}
async function load(){try{const [rs,cats]=await Promise.all([api.restaurants(),api.categories()]);status.textContent=rs.length+' ta faol restoran, '+cats.length+' ta kategoriya bazadan olindi.';list.replaceChildren(...rs.map(r=>card(r.name,r.description||r.address_line||'')));for(const r of rs){const o=document.createElement('option');o.value=r.id;o.textContent=r.name;select.append(o)}if(!rs.length)list.textContent='Hozircha faol restoran topilmadi.'}catch(e){status.className='err';status.textContent='Bazadan o‘qishda xato: '+e.message}}
select.addEventListener('change',async()=>{foods.textContent='Yuklanmoqda...';if(!select.value){foods.textContent='';return}try{const items=await api.menuItems(select.value);foods.replaceChildren(...items.map(f=>card(f.name,Number(f.price_uzs).toLocaleString('uz-UZ')+' so‘m · '+(f.description||''))));if(!items.length)foods.textContent='Mavjud taom topilmadi.'}catch(e){foods.className='err';foods.textContent='Xato: '+e.message}});load();
</script></body></html>
