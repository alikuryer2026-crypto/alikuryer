name: ALIKURYER Customer Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_customer/**'
      - '.github/workflows/flutter-customer-apk.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare 3D courier artwork from existing Alikuryer site asset
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import re, base64, io, os
          from PIL import Image
          source = open('docs/index.html', encoding='utf-8').read()
          match = re.search(r'data:image/webp;base64,([A-Za-z0-9+/=]+)', source)
          if not match:
              raise RuntimeError('3D courier artwork missing from docs/index.html')
          art = Image.open(io.BytesIO(base64.b64decode(match.group(1)))).convert('RGBA')
          w, h = art.size
          # Isolate the courier, not the whole promotional composition.
          # Original artwork has burgers at far right and pagination dots below.
          # Preserve the red scooter, rider and delivery box.
          art = art.crop((int(w * .52), int(h * .10), int(w * .81), int(h * .91)))
          # Transparent rounded-rectangle mask avoids visible rectangular corners.
          from PIL import ImageDraw, ImageFilter
          mask = Image.new('L', art.size, 0)
          d = ImageDraw.Draw(mask)
          d.rounded_rectangle((3, 3, art.width - 4, art.height - 4),
                              radius=32, fill=255)
          mask = mask.filter(ImageFilter.GaussianBlur(6))
          art.putalpha(mask)
          os.makedirs('flutter_customer/assets', exist_ok=True)
          art.save('flutter_customer/assets/courier_3d.webp', 'WEBP', quality=92)
          PY
      - name: Generate Android project files
        working-directory: flutter_customer
        run: flutter create --platforms=android --project-name alikuryer_customer .
      - name: Get dependencies
        working-directory: flutter_customer
        run: flutter pub get
      - name: Flutter analyze
        working-directory: flutter_customer
        run: flutter analyze --no-fatal-infos
      - name: Flutter tests
        working-directory: flutter_customer
        run: flutter test
      - name: Build debug APK for installation testing
        working-directory: flutter_customer
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: alikuryer-customer-debug-apk
          path: flutter_customer/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Publish one-tap APK download to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp flutter_customer/build/app/outputs/flutter-apk/app-debug.apk alikuryer-customer.apk
          gh release view customer-preview >/dev/null 2>&1 || gh release create customer-preview --title "ALIKURYER Android sinov ilovasi" --notes "Android debug APK: test uchun. Haqiqiy buyurtma va to'lovlar hali ulanmagan." --prerelease --target main
          gh release upload customer-preview alikuryer-customer.apk --clobber
