name: ALIKURYER Customer Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_customer/**'
      - '.github/workflows/flutter-customer-apk.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        working-directory: flutter_customer
        run: flutter create --platforms=android --project-name alikuryer_customer .
      - name: Get dependencies
        working-directory: flutter_customer
        run: flutter pub get
      - name: Flutter analyze
        working-directory: flutter_customer
        run: flutter analyze --no-fatal-infos
      - name: Flutter tests
        working-directory: flutter_customer
        run: flutter test
      - name: Build debug APK for installation testing
        working-directory: flutter_customer
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: alikuryer-customer-debug-apk
          path: flutter_customer/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
