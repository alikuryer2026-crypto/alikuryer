name: ALIKURYER Customer Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'flutter_customer/**'
      - '.github/workflows/flutter-customer-apk.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Gradle downloads and wrappers
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-alikuryer-gradle-${{ hashFiles('flutter_customer/pubspec.lock', 'flutter_customer/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-alikuryer-gradle-
      - name: Prepare 3D courier artwork from existing Alikuryer site asset
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import re, base64, io, os
          from PIL import Image
          source = open('docs/index.html', encoding='utf-8').read()
          match = re.search(r'data:image/webp;base64,([A-Za-z0-9+/=]+)', source)
          if not match:
              raise RuntimeError('3D courier artwork missing from docs/index.html')
          art = Image.open(io.BytesIO(base64.b64decode(match.group(1)))).convert('RGBA')
          w, h = art.size
          # Isolate the courier, not the whole promotional composition.
          # Original artwork has burgers at far right and pagination dots below.
          # Preserve the red scooter, rider and delivery box.
          art = art.crop((int(w * .43), int(h * .08), int(w * .87), int(h * .91)))
          # Soft feathered edge blends with the red background without a hard frame.
          from PIL import ImageDraw, ImageFilter
          mask = Image.new('L', art.size, 0)
          d = ImageDraw.Draw(mask)
          inset = max(6, int(art.width * .04))
          d.rounded_rectangle((inset, inset, art.width-inset, art.height-inset),
                              radius=int(art.width * .15), fill=255)
          mask = mask.filter(ImageFilter.GaussianBlur(max(8, int(art.width * .05))))
          art.putalpha(mask)
          os.makedirs('flutter_customer/assets', exist_ok=True)
          art.save('flutter_customer/assets/courier_3d.webp', 'WEBP', quality=92)
          PY
      - name: Generate Android project files
        working-directory: flutter_customer
        run: flutter create --platforms=android --project-name alikuryer_customer .
      - name: Replace Flutter startup logo with Alikuryer native splash
        working-directory: flutter_customer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import re
          root = Path('android/app/src/main/res')
          drawable = root / 'drawable'
          drawable.mkdir(parents=True, exist_ok=True)
          # Transparent white Alikuryer initial, centered inside the Android 12 safe icon zone.
          icon = Image.new('RGBA', (432, 432), (0, 0, 0, 0))
          d = ImageDraw.Draw(icon)
          font_path = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          font = ImageFont.truetype(font_path, 190)
          box = d.textbbox((0, 0), 'A', font=font)
          x = (432 - (box[2] - box[0])) / 2 - box[0]
          y = (432 - (box[3] - box[1])) / 2 - box[1]
          d.text((x, y), 'A', font=font, fill='white', stroke_width=2, stroke_fill='white')
          icon.save(drawable / 'alikuryer_splash_icon.png')
          # A drawable attribute must reference a resource, not a raw hex color.
          values = root / 'values'
          values.mkdir(parents=True, exist_ok=True)
          (values / 'alikuryer_colors.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>'
              '<resources><color name="alikuryer_red">#B90019</color></resources>')
          # Pre-Android 12 launch screen: red background and centered brand mark.
          background = '''<?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:drawable="@color/alikuryer_red"/>
            <item>
              <bitmap android:gravity="center" android:src="@drawable/alikuryer_splash_icon"/>
            </item>
          </layer-list>
          '''
          for name in ('drawable', 'drawable-v21'):
              directory = root / name
              directory.mkdir(parents=True, exist_ok=True)
              (directory / 'launch_background.xml').write_text(background)
          # Android 12+ uses the system splash API; override the generated Flutter icon.
          for name in ('values-v31', 'values-night-v31'):
              directory = root / name
              directory.mkdir(parents=True, exist_ok=True)
              (directory / 'styles.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
              <item name="android:windowSplashScreenBackground">#B90019</item>
              <item name="android:windowSplashScreenAnimatedIcon">@drawable/alikuryer_splash_icon</item>
              <item name="android:windowSplashScreenIconBackgroundColor">#B90019</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:statusBarColor">#B90019</item>
            </style>
            <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
              <item name="android:windowBackground">?android:colorBackground</item>
            </style>
          </resources>
          ''')
          # Existing generated styles for older devices: set red startup background.
          for name in ('values', 'values-night'):
              file = root / name / 'styles.xml'
              if file.exists():
                  content = file.read_text()
                  content = content.replace(
                    '<item name="android:windowBackground">@drawable/launch_background</item>',
                    '<item name="android:windowBackground">@drawable/launch_background</item>')
                  file.write_text(content)
          PY
      - name: Get dependencies
        working-directory: flutter_customer
        run: flutter pub get
      - name: Flutter analyze
        working-directory: flutter_customer
        run: flutter analyze --no-fatal-infos
      - name: Flutter tests
        working-directory: flutter_customer
        run: flutter test
      - name: Build debug APK for installation testing (retry temporary Maven throttling)
        working-directory: flutter_customer
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Android APK build attempt ${attempt}/3"
            if flutter build apk --debug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "APK build failed after three attempts"
              exit 1
            fi
            echo "Build failed; waiting for temporary Maven/Gradle rate limits to clear"
            sleep $((attempt * 45))
          done
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: alikuryer-customer-debug-apk
          path: flutter_customer/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Publish one-tap APK download to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp flutter_customer/build/app/outputs/flutter-apk/app-debug.apk alikuryer-customer.apk
          gh release view customer-preview >/dev/null 2>&1 || gh release create customer-preview --title "ALIKURYER Android sinov ilovasi" --notes "Android debug APK: test uchun. Haqiqiy buyurtma va to'lovlar hali ulanmagan." --prerelease --target main
          gh release upload customer-preview alikuryer-customer.apk --clobber
